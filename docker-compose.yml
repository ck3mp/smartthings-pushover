# NAS deployment: pulls the published image, no build step.
#
#   docker login ghcr.io -u ck3mp      # once; PAT with read:packages (private repo)
#   docker compose pull && docker compose up -d
#   docker compose logs -f
#
# Fill in the environment block below (or leave a value blank to use the
# default shown in the comment). Mount the directory holding
# client_fullchain.pem + client.key from SmartThings-Local's setup_cert.py.

services:
  smartthings-pushover:
    image: ghcr.io/ck3mp/smartthings-pushover:latest
    container_name: smartthings-pushover
    restart: unless-stopped

    # Host networking: the bridge speaks DTLS/UDP straight to the
    # appliances and binds a fixed local port per appliance
    # (*_DTLS_LOCAL_PORT) so a restart re-handshakes from the same address
    # and the appliance drops its stale session instead of ignoring us for
    # 5-15 min. Nothing is exposed inbound.
    network_mode: host

    volumes:
      # <-- change the left side to where the certs live on your NAS
      - /volume1/docker/smartthings-pushover/certs:/config:ro

    environment:
      # ---- Appliances -----------------------------------------------
      # Each appliance is on when its _IP is set; force with _ENABLED.
      # At least one must be enabled. Only one client may talk to an
      # appliance at a time, so never run two bridges against the same IP.
      WASHER_ENABLED: ""              # blank = on if WASHER_IP set; "false" to skip
      WASHER_IP: "192.168.1.40"
      WASHER_PORT: ""                 # blank = auto-discover (WW80 uses 49154)
      WASHER_NAME: "Washing machine"  # title of every washer notification
      # Course code -> name. --dump lists every code the appliance knows:
      #   docker compose run --rm smartthings-pushover python -m smartthings_pushover --dump washer
      WASHER_COURSE_NAMES: "1C=Eco 40-60,1B=Cotton,25=Synthetics,20=Hygiene Steam,08=Rinse+Spin,74=Drum Clean,87=Downloaded,06=Bedding,7F=Wool/Delicates,65=Colours,8F=Intense Cold,96=Less Microfiber,34=Mixed Load,A0=Quick Wash 15'"
      WASHER_DTLS_LOCAL_PORT: "49700" # fixed local UDP port; "random" to let the OS pick

      DRYER_ENABLED: ""               # blank = on if DRYER_IP set; "false" to skip
      DRYER_IP: "192.168.1.253"
      DRYER_PORT: ""                  # blank = auto-discover (DV80 uses 49154)
      DRYER_NAME: "Tumble dryer"
      DRYER_COURSE_NAMES: "16=Cotton,18=Synthetics,1F=Mixed Load,19=Delicates,20=Iron Dry,1A=Wool,1D=Towels,1B=Bedding,1E=Outdoor,43=Downloaded,23=Quick Dry 35',27=Time Dry,25=Warm Air,24=Cool Air"
      DRYER_DTLS_LOCAL_PORT: "49701"  # must differ from the washer's

      # ---- Pushover (required) --------------------------------------
      PUSHOVER_TOKEN: ""              # application API token
      PUSHOVER_USER: ""               # user or group key
      PUSHOVER_DEVICE: ""             # optional: deliver to one device only
      PUSHOVER_SOUND: ""              # optional: default sound name
      PUSHOVER_PRIORITY: "0"          # -2 .. 1
      PUSHOVER_FINISHED_SOUND: ""     # optional: sound just for "laundry is done"
      PUSHOVER_ALARM_PRIORITY: "1"    # priority for alarm/error messages

      # ---- Events -------------------------------------------------------
      # Comma-separated, or "all". Blank = cycle_started,cycle_finished,
      # cycle_paused,cycle_cancelled,alarm. Available: cycle_started,
      # cycle_finished, cycle_paused, cycle_resumed, cycle_cancelled,
      # phase_changed, alarm, power_on, power_off, remote_control,
      # child_lock, offline, online
      EVENTS: ""
      STARTUP_NOTIFY: "true"         # one message per appliance when the bridge first connects
      OFFLINE_AFTER_S: "900"          # unreachable this long -> "offline" event

      # ---- Tuning (defaults are fine) -------------------------------------
      CERT_PATH: "/config/client_fullchain.pem"
      KEY_PATH: "/config/client.key"
      LOG_LEVEL: "INFO"               # DEBUG shows every OBSERVE push and poll
      HEALTH_INTERVAL_S: "300"        # health log line cadence
      HOT_POLL_S: "2"                 # state poll interval while idle
      HOT_POLL_ACTIVE_S: "1"          # state poll interval during a cycle
      PING_INTERVAL_S: "25"
