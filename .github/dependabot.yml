version: 2
updates:
  # Python dependencies via uv.lock
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  # SHA-pinned actions in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Digest-pinned base images in the Dockerfile
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
