services:
  smartthings-pushover:
    build: .
    image: smartthings-pushover:latest
    container_name: smartthings-pushover
    restart: unless-stopped
    # The bridge binds a fixed local UDP port per appliance
    # (WASHER_DTLS_LOCAL_PORT 49700, DRYER_DTLS_LOCAL_PORT 49701) so a
    # crash-restart re-handshakes from the same 5-tuple and the appliance
    # evicts its orphaned session instead of wedging for 5-15 min. Host
    # networking keeps those ports stable through Docker's NAT.
    network_mode: host
    volumes:
      # Directory containing client_fullchain.pem + client.key
      - ${CERT_DIR:-./certs}:/config:ro
      # Persisted cycle trackers (git-ignored). Must be writable by uid 1000.
      - ${DATA_DIR:-./data}:/data
    env_file:
      - .env
